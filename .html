<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astro 元件目錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="flex h-screen">
      <!-- 側邊欄 -->
      <aside class="w-64 bg-white border-r border-gray-200 overflow-y-auto">
        <div class="p-4 border-b border-gray-200">
          <h1 class="text-xl font-bold text-gray-800">元件目錄</h1>
          <fieldset>
            <legend>搜索</legend>
            <input type="text" id="searchInput" placeholder="搜索元件..." class="mt-3 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </fieldset>
        </div>

        <nav class="p-2" id="componentList">
          <!-- 元件列表將動態生成 -->
        </nav>
      </aside>

      <!-- 主內容區 -->
      <main class="flex-1 overflow-hidden flex flex-col">
        <!-- 頂部標題欄 -->
        <header class="bg-white border-b border-gray-200 p-4">
          <h2 class="text-2xl font-semibold text-gray-800" id="componentTitle">選擇一個元件</h2>
        </header>

        <div class="flex-1 overflow-hidden flex">
          <!-- 參數控制面板 -->
          <div class="w-80 bg-white border-r border-gray-200 overflow-y-auto p-4">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">參數設定</h3>
            <div id="controlPanel" class="space-y-4">
              <p class="text-gray-500 text-sm">請選擇元件以查看可用參數</p>
            </div>
          </div>

          <!-- 預覽區域 -->
          <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 min-h-full">
              <div id="previewArea" class="flex items-center justify-center min-h-[400px]">
                <p class="text-gray-400">元件預覽區域</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      // 元件定義
      const components = {
        Button: {
          category: '基礎元件',
          props: {
            text: { type: 'text', default: '點擊我', label: '按鈕文字' },
            variant: {
              type: 'select',
              default: 'primary',
              options: ['primary', 'secondary', 'danger', 'success'],
              label: '變體',
            },
            size: {
              type: 'select',
              default: 'md',
              options: ['sm', 'md', 'lg'],
              label: '大小',
            },
            disabled: { type: 'boolean', default: false, label: '禁用' },
          },
          render: (props) => {
            const sizeClasses = {
              sm: 'px-3 py-1.5 text-sm',
              md: 'px-4 py-2 text-base',
              lg: 'px-6 py-3 text-lg',
            }
            const variantClasses = {
              primary: 'bg-blue-600 hover:bg-blue-700 text-white',
              secondary: 'bg-gray-600 hover:bg-gray-700 text-white',
              danger: 'bg-red-600 hover:bg-red-700 text-white',
              success: 'bg-green-600 hover:bg-green-700 text-white',
            }
            return `
            <button 
              class="rounded-lg font-medium transition-colors ${sizeClasses[props.size]} ${variantClasses[props.variant]} ${props.disabled ? 'opacity-50 cursor-not-allowed' : ''}"
              ${props.disabled ? 'disabled' : ''}
            >
              ${props.text}
            </button>
          `
          },
        },
        Card: {
          category: '佈局元件',
          props: {
            title: { type: 'text', default: '卡片標題', label: '標題' },
            content: { type: 'textarea', default: '這是卡片的內容區域', label: '內容' },
            image: { type: 'text', default: 'https://via.placeholder.com/300x200', label: '圖片 URL' },
            showImage: { type: 'boolean', default: true, label: '顯示圖片' },
          },
          render: (props) => `
          <div class="max-w-sm rounded-lg overflow-hidden shadow-lg bg-white">
            ${props.showImage ? `<img class="w-full" src="${props.image}" alt="${props.title}">` : ''}
            <div class="px-6 py-4">
              <div class="font-bold text-xl mb-2">${props.title}</div>
              <p class="text-gray-700 text-base">${props.content}</p>
            </div>
          </div>
        `,
        },
        Alert: {
          category: '通知元件',
          props: {
            message: { type: 'text', default: '這是一條提示訊息', label: '訊息' },
            type: {
              type: 'select',
              default: 'info',
              options: ['info', 'success', 'warning', 'error'],
              label: '類型',
            },
            dismissible: { type: 'boolean', default: true, label: '可關閉' },
          },
          render: (props) => {
            const typeClasses = {
              info: 'bg-blue-50 border-blue-200 text-blue-800',
              success: 'bg-green-50 border-green-200 text-green-800',
              warning: 'bg-yellow-50 border-yellow-200 text-yellow-800',
              error: 'bg-red-50 border-red-200 text-red-800',
            }
            return `
            <div class="border rounded-lg p-4 ${typeClasses[props.type]} flex items-center justify-between">
              <span>${props.message}</span>
              ${props.dismissible ? '<button class="ml-4 font-bold">×</button>' : ''}
            </div>
          `
          },
        },
        Badge: {
          category: '基礎元件',
          props: {
            text: { type: 'text', default: 'NEW', label: '文字' },
            color: {
              type: 'select',
              default: 'blue',
              options: ['blue', 'green', 'red', 'yellow', 'purple'],
              label: '顏色',
            },
            size: {
              type: 'select',
              default: 'md',
              options: ['sm', 'md', 'lg'],
              label: '大小',
            },
          },
          render: (props) => {
            const sizeClasses = {
              sm: 'px-2 py-0.5 text-xs',
              md: 'px-2.5 py-1 text-sm',
              lg: 'px-3 py-1.5 text-base',
            }
            const colorClasses = {
              blue: 'bg-blue-100 text-blue-800',
              green: 'bg-green-100 text-green-800',
              red: 'bg-red-100 text-red-800',
              yellow: 'bg-yellow-100 text-yellow-800',
              purple: 'bg-purple-100 text-purple-800',
            }
            return `
            <span class="inline-flex items-center font-medium rounded-full ${sizeClasses[props.size]} ${colorClasses[props.color]}">
              ${props.text}
            </span>
          `
          },
        },
      }

      let currentComponent = null
      let currentProps = {}

      // 初始化
      function init() {
        renderComponentList()
        setupSearch()
      }

      // 渲染元件列表
      function renderComponentList(filter = '') {
        const list = document.getElementById('componentList')
        const categories = {}

        // 按分類分組
        Object.entries(components).forEach(([name, config]) => {
          if (!filter || name.toLowerCase().includes(filter.toLowerCase())) {
            if (!categories[config.category]) {
              categories[config.category] = []
            }
            categories[config.category].push(name)
          }
        })

        list.innerHTML = ''
        Object.entries(categories).forEach(([category, names]) => {
          const categoryDiv = document.createElement('div')
          categoryDiv.className = 'mb-4'
          categoryDiv.innerHTML = `
          <div class="px-3 py-2 text-xs font-semibold text-gray-500 uppercase">${category}</div>
        `

          names.forEach((name) => {
            const button = document.createElement('button')
            button.className = 'w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors'
            button.textContent = name
            button.onclick = () => selectComponent(name)
            categoryDiv.appendChild(button)
          })

          list.appendChild(categoryDiv)
        })
      }

      // 選擇元件
      function selectComponent(name) {
        currentComponent = name
        const config = components[name]

        // 初始化屬性值
        currentProps = {}
        Object.entries(config.props).forEach(([key, prop]) => {
          currentProps[key] = prop.default
        })

        document.getElementById('componentTitle').textContent = name
        renderControlPanel()
        renderPreview()
      }

      // 渲染控制面板
      function renderControlPanel() {
        const panel = document.getElementById('controlPanel')
        const config = components[currentComponent]

        panel.innerHTML = ''
        Object.entries(config.props).forEach(([key, prop]) => {
          const controlDiv = document.createElement('div')
          controlDiv.className = 'space-y-2'

          const label = document.createElement('label')
          label.className = 'block text-sm font-medium text-gray-700'
          label.textContent = prop.label
          controlDiv.appendChild(label)

          let input
          switch (prop.type) {
            case 'text':
              input = document.createElement('input')
              input.type = 'text'
              input.value = currentProps[key]
              input.className = 'w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500'
              input.oninput = (e) => updateProp(key, e.target.value)
              break

            case 'textarea':
              input = document.createElement('textarea')
              input.value = currentProps[key]
              input.rows = 3
              input.className = 'w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500'
              input.oninput = (e) => updateProp(key, e.target.value)
              break

            case 'select':
              input = document.createElement('select')
              input.className = 'w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500'
              prop.options.forEach((option) => {
                const opt = document.createElement('option')
                opt.value = option
                opt.textContent = option
                opt.selected = currentProps[key] === option
                input.appendChild(opt)
              })
              input.onchange = (e) => updateProp(key, e.target.value)
              break

            case 'boolean':
              const wrapper = document.createElement('div')
              wrapper.className = 'flex items-center'
              input = document.createElement('input')
              input.type = 'checkbox'
              input.checked = currentProps[key]
              input.className = 'w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500'
              input.onchange = (e) => updateProp(key, e.target.checked)
              wrapper.appendChild(input)
              controlDiv.appendChild(wrapper)
              panel.appendChild(controlDiv)
              return
          }

          controlDiv.appendChild(input)
          panel.appendChild(controlDiv)
        })
      }

      // 更新屬性
      function updateProp(key, value) {
        currentProps[key] = value
        renderPreview()
      }

      // 渲染預覽
      function renderPreview() {
        const preview = document.getElementById('previewArea')
        const config = components[currentComponent]
        preview.innerHTML = config.render(currentProps)
      }

      // 設置搜索
      function setupSearch() {
        const searchInput = document.getElementById('searchInput')
        searchInput.addEventListener('input', (e) => {
          renderComponentList(e.target.value)
        })
      }

      init()
    </script>
  </body>
</html>
